<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Space: Compact Mobile</title>
  <style>
    body { 
      background-color: #050505; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; 
    }

    /* --- ROTATE SCREEN MESSAGE --- */
    #rotate-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: cyan;
      text-align: center;
    }
    .rotate-icon { font-size: 50px; margin-bottom: 20px; animation: spin 2s infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 25% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }

    @media screen and (max-width: 900px) and (orientation: portrait) {
      #rotate-overlay { display: flex; }
      #gameCanvas, #ui-layer, #mobile-controls, #menu-overlay { display: none !important; }
    }

    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 20px;
      box-sizing: border-box;
      z-index: 10;
    }

    /* HUD */
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .score-box { text-align: left; }
    .score-val { font-size: 24px; color: #fff; text-shadow: 0 0 10px #fff; font-weight: bold; }
    .sub-text { color: #aaa; font-size: 12px; }
    
    .bar-container { 
      width: 150px; height: 8px; background: #333; margin-top: 5px; 
      border-radius: 4px; overflow: hidden; border: 1px solid #555; 
    }
    .bar-fill { height: 100%; width: 0%; transition: width 0.1s; }
    #xp-bar { background: linear-gradient(90deg, #00c6ff, #0072ff); }
    #energy-bar { background: linear-gradient(90deg, #f12711, #f5af19); width: 100%; }

    .level-badge {
      background: rgba(0, 255, 255, 0.1);
      border: 2px solid cyan;
      color: cyan;
      padding: 5px 15px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    /* PC Controls Hint */
    .skills { display: flex; gap: 20px; align-items: flex-end; }
    .skill-box { text-align: center; color: white; font-size: 12px; opacity: 0.7; }
    .skill-box.ready { opacity: 1; color: #00e676; font-weight: bold; transform: scale(1.1); }
    .key-hint { border: 1px solid #777; padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; display: inline-block; background: #222; }

    /* --- MOBILE CONTROLS (Compact & Optimized) --- */
    #mobile-controls {
      display: none; 
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* Joystick: Compact Size */
    #joystick-area { 
      position: absolute;
      bottom: 25px; left: 25px; 
      width: 110px; height: 110px; /* Reduced from 140 */
      pointer-events: auto;
    }
    #joystick-base {
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: relative;
    }
    #joystick-thumb {
      width: 45px; height: 45px; /* Reduced from 60 */
      background: rgba(0, 255, 255, 0.5);
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px cyan;
    }

    /* Buttons: Compact Size */
    #button-area { 
      position: absolute;
      bottom: 25px; right: 25px; 
      display: grid; 
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px; /* Reduced gap */
      pointer-events: auto;
    }
    
    .mob-btn {
      width: 55px; height: 55px; /* Reduced from 70 */
      border-radius: 50%;
      border: 2px solid white;
      background: rgba(0,0,0,0.4);
      color: white;
      font-size: 24px; /* Smaller Icon */
      display: flex; justify-content: center; align-items: center;
      touch-action: manipulation;
    }
    .mob-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }
    
    #btn-shoot { grid-column: 3; border-color: #ff4444; color: #ff4444; } 
    #btn-dash { grid-column: 2; border-color: cyan; color: cyan; }
    #btn-slow { grid-column: 1; border-color: #f12711; color: #f12711; }
    
    /* Nuke Button (Smaller) */
    #btn-nuke { 
      grid-column: 3; grid-row: 2; 
      margin-top: -50px; /* Tighter layout */
      border-color: gold; color: gold; 
      font-size: 18px; 
      width: 45px; height: 45px; 
      align-self: start; justify-self: end;
    }
    
    /* Risk Button (Smaller) */
    #btn-risk { 
      position: absolute; 
      top: -50px; right: 0; 
      width: 35px; height: 35px; 
      font-size: 14px; 
      border-color: #aaa; color: #aaa; 
    }
    #btn-risk.active { background: red; border-color: red; color: white; }

    /* Menu */
    #menu-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    .hidden { opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    h1 { font-size: 50px; margin: 0; background: linear-gradient(to right, #ff00cc, #333399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255,0,200,0.5); }
    
    button#startBtn {
      background: transparent;
      border: 2px solid #00e676;
      color: #00e676;
      padding: 10px 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }
  </style>
</head>
<body>

  <!-- Rotate Message -->
  <div id="rotate-overlay">
    <div class="rotate-icon">📱</div>
    <h2>ROTATE DEVICE</h2>
    <p>Please rotate your phone to Landscape<br>for the best experience.</p>
  </div>

  <!-- UI Layer -->
  <div id="ui-layer">
    <div class="hud-top">
      <div class="score-box">
        <div class="sub-text">SCORE</div>
        <div class="score-val" id="scoreVal">0</div>
      </div>
      <div class="level-badge" id="levelBadge">LVL 1</div>
      <div class="score-box" style="text-align: right;">
        <div class="sub-text">ENERGY</div>
        <div class="bar-container" style="margin-left: auto;">
          <div class="bar-fill" id="energy-bar"></div>
        </div>
        <div class="sub-text" style="margin-top:5px;">XP</div>
        <div class="bar-container" style="margin-left: auto; width: 100px;">
          <div class="bar-fill" id="xp-bar"></div>
        </div>
      </div>
    </div>

    <div class="skills" id="pc-controls-ui">
      <div class="skill-box" id="dashIndicator">
        <div class="key-hint">SPACE</div> DASH
      </div>
      <div class="skill-box" id="nukeIndicator">
        <div class="key-hint">DBL CLICK</div> NUKE
      </div>
    </div>
  </div>

  <!-- Mobile Controls (Compact) -->
  <div id="mobile-controls">
    <div id="joystick-area">
      <div id="joystick-base">
        <div id="joystick-thumb"></div>
      </div>
    </div>

    <div id="button-area">
      <div class="mob-btn" id="btn-risk">😈</div>
      <div class="mob-btn" id="btn-slow">⏳</div>
      <div class="mob-btn" id="btn-dash">💨</div>
      <div class="mob-btn" id="btn-shoot">🔥</div>
      <div class="mob-btn" id="btn-nuke">☢️</div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="menu-overlay">
    <h1>CYBER SPACE</h1>
    <p style="color: #ccc; margin-top: 5px;">COMPACT EDITION</p>
    <div style="color: #888; margin-top: 20px; font-size: 14px;">
      Detecting Device...
    </div>
    <button id="startBtn">PLAY FULLSCREEN</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- 1. Responsive & Orientation Logic ---
    let isMobile = false;
    
    function checkDevice() {
      isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      
      const mobileUI = document.getElementById('mobile-controls');
      const pcUI = document.getElementById('pc-controls-ui');
      const msg = document.querySelector('#menu-overlay div');
      
      if(isMobile) {
        mobileUI.style.display = 'block';
        pcUI.style.display = 'none';
        msg.innerText = "Mobile Detected 📱";
        msg.innerHTML += "<br>Compact Controls enabled.";
      } else {
        mobileUI.style.display = 'none';
        pcUI.style.display = 'flex';
        msg.innerText = "PC Detected 🖥️";
      }
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    checkDevice();

    async function enterFullscreen() {
      const doc = document.documentElement;
      if (doc.requestFullscreen) {
        await doc.requestFullscreen().catch(e => console.log(e));
      }
      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock("landscape"); } catch (e) {}
      }
    }

    // --- 2. Input Handling ---
    const keys = { space: false, shift: false, click: false, rightClick: false, nuke: false };
    const joystick = { active: false, x: 0, y: 0 };
    let mouse = { x: canvas.width/2, y: canvas.height/2 };

    window.addEventListener('mousemove', e => mouse = {x: e.clientX, y: e.clientY});
    window.addEventListener('mousedown', e => { if(e.button===0) keys.click=true; if(e.button===2) keys.rightClick=true; });
    window.addEventListener('mouseup', e => { if(e.button===0) keys.click=false; if(e.button===2) keys.rightClick=false; });
    window.addEventListener('keydown', e => { if(e.code==='Space') keys.space=true; if(e.key==='Shift') keys.shift=true; });
    window.addEventListener('keyup', e => { if(e.code==='Space') keys.space=false; if(e.key==='Shift') keys.shift=false; });
    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('dblclick', () => { triggerNuke(); });

    // Mobile Joystick
    const joyBase = document.getElementById('joystick-base');
    const joyThumb = document.getElementById('joystick-thumb');
    let joyCenter = { x: 0, y: 0 };
    let joyTouchId = null;

    joyBase.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyBase.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
      joystick.active = true;
      updateJoystick(touch.clientX, touch.clientY);
    });

    joyBase.addEventListener('touchmove', e => {
      e.preventDefault();
      for(let i=0; i<e.changedTouches.length; i++) {
        if(e.changedTouches[i].identifier === joyTouchId) {
          updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }
      }
    });

    joyBase.addEventListener('touchend', e => {
      e.preventDefault();
      joystick.active = false;
      joystick.x = 0; joystick.y = 0;
      joyThumb.style.transform = `translate(-50%, -50%)`;
    });

    function updateJoystick(tx, ty) {
      const maxDist = 35; // Adjusted travel distance for smaller joystick
      let dx = tx - joyCenter.x;
      let dy = ty - joyCenter.y;
      const distVal = Math.min(Math.hypot(dx, dy), maxDist);
      const angle = Math.atan2(dy, dx);
      const moveX = Math.cos(angle) * distVal;
      const moveY = Math.sin(angle) * distVal;
      
      joyThumb.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
      joystick.x = moveX / maxDist;
      joystick.y = moveY / maxDist;
    }

    // Mobile Buttons
    const btnShoot = document.getElementById('btn-shoot');
    const btnDash = document.getElementById('btn-dash');
    const btnSlow = document.getElementById('btn-slow');
    const btnNuke = document.getElementById('btn-nuke');
    const btnRisk = document.getElementById('btn-risk');

    btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); keys.click = true; });
    btnShoot.addEventListener('touchend', (e) => { e.preventDefault(); keys.click = false; });
    
    btnDash.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; });
    btnDash.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });

    btnSlow.addEventListener('touchstart', (e) => { e.preventDefault(); keys.shift = true; });
    btnSlow.addEventListener('touchend', (e) => { e.preventDefault(); keys.shift = false; });

    btnNuke.addEventListener('touchstart', (e) => { e.preventDefault(); triggerNuke(); });

    btnRisk.addEventListener('touchstart', (e) => {
        e.preventDefault();
        keys.rightClick = !keys.rightClick; 
        if(keys.rightClick) btnRisk.classList.add('active');
        else btnRisk.classList.remove('active');
    });

    // --- 3. Game Logic ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();
    function playSound(type) {
      if(actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      const now = actx.currentTime;
      if (type === 'shoot') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.type = 'square'; osc.start(); osc.stop(now+0.1);
      } else if (type === 'explode') {
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.type = 'sawtooth'; osc.start(); osc.stop(now+0.3);
      }
      osc.connect(gain); gain.connect(actx.destination);
    }

    let gameRunning=false, frame=0, score=0, timeScale=1.0, shake=0;
    const player = { x: 0, y: 0, size: 50, level:1, xp:0, maxXp:10, energy:100, maxEnergy:100, dashCooldown:0, isDashing:false, trail:[], emoji:'🚀' };
    let bullets=[], enemies=[], enemyBullets=[], particles=[], orbs=[], floatText=[];

    function resetGame() {
      score=0; frame=0; player.level=1; player.xp=0; player.maxXp=10; player.energy=100;
      player.x = canvas.width/2; player.y = canvas.height - 100;
      enemies=[]; bullets=[]; enemyBullets=[]; orbs=[]; particles=[];
      updateUI();
    }

    function triggerNuke() {
      if(player.energy > 30) {
        player.energy -= 30;
        for(let i=0; i<8; i++) bullets.push({x: player.x, y: player.y, vx: Math.cos(i)*10, vy: Math.sin(i)*10, size: 20, emoji: '🎆', dmg: 5});
        shake = 10; playSound('explode');
      }
    }

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function dist(x1, y1, x2, y2) { return Math.hypot(x1-x2, y1-y2); }

    class Particle {
      constructor(x,y,c,s,sz=3) { this.x=x;this.y=y;this.c=c;this.vx=(Math.random()-0.5)*s;this.vy=(Math.random()-0.5)*s;this.life=1.0;this.size=sz; }
      update() { this.x+=this.vx*timeScale; this.y+=this.vy*timeScale; this.life-=0.03; }
      draw() { ctx.globalAlpha=this.life; ctx.fillStyle=this.c; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
    }

    function spawnEnemy() {
      const type = Math.random();
      let e = { x: rand(30, canvas.width-30), y: -50, size: 40, hp: 1+Math.floor(score/500), vx: rand(-1,1), vy: rand(2,4), type: 'basic', emoji:'👾' };
      if(type>0.8 && frame>300) { e.type='shooter'; e.emoji='🛸'; e.vy=1.5; e.hp=3; e.shootT=0; }
      else if(type>0.95 && frame>600) { e.type='tank'; e.emoji='🗿'; e.size=60; e.hp=10; e.vy=0.5; }
      enemies.push(e);
    }

    function drawRotatedText(txt, x, y, angle, size, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = opacity;
      ctx.font = `${size}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(txt, 0, 0);
      ctx.restore();
    }

    // --- GAME LOOP ---
    function loop() {
      if(!gameRunning) return;

      if(keys.shift && player.energy > 0) { timeScale=0.2; player.energy-=0.5; ctx.fillStyle='rgba(0,50,255,0.1)'; ctx.fillRect(0,0,canvas.width,canvas.height); }
      else { timeScale=1.0; if(player.energy < player.maxEnergy) player.energy += 0.1; }

      ctx.fillStyle='rgba(5,5,5,0.4)'; ctx.fillRect(0,0,canvas.width,canvas.height);

      let sx=0, sy=0;
      if(shake>0) { sx=rand(-shake,shake); sy=rand(-shake,shake); shake*=0.9; if(shake<0.5) shake=0; }
      ctx.save(); ctx.translate(sx, sy);

      // Stars
      ctx.fillStyle='white';
      for(let i=0; i<4; i++) { ctx.fillRect(rand(0,canvas.width), rand(0,canvas.height), 2, 2); }

      // Movement
      if(isMobile) {
        const speed = 10;
        player.x += joystick.x * speed;
        player.y += joystick.y * speed;
        if(player.x < 0) player.x = 0; if(player.x > canvas.width) player.x = canvas.width;
        if(player.y < 0) player.y = 0; if(player.y > canvas.height) player.y = canvas.height;
      } else {
        player.x += (mouse.x - player.x) * 0.15;
      }

      if(keys.space && player.dashCooldown <= 0) { player.isDashing=true; player.dashCooldown=60; for(let i=0;i<10;i++) particles.push(new Particle(player.x,player.y,'cyan',10)); }
      if(player.dashCooldown>0) player.dashCooldown--;
      if(player.isDashing) { player.y-=10; if(player.dashCooldown<50) { player.isDashing=false; } }

      if(Math.random()>0.1) {
        let p = new Particle(player.x+rand(-5,5), player.y+player.size/2-5, Math.random()>0.5?'orange':'red', 2, rand(3,6));
        p.vy = rand(3,8); particles.push(p);
      }

      player.trail.push({x:player.x, y:player.y});
      if(player.trail.length>8) player.trail.shift();
      
      let displayEmoji = keys.rightClick ? '👿' : player.emoji;
      let angle = (displayEmoji === '🚀') ? -Math.PI/4 : 0; // Vertical Rocket

      player.trail.forEach((t,i) => drawRotatedText(displayEmoji, t.x, t.y, angle, player.size, i/10));
      drawRotatedText(displayEmoji, player.x, player.y, angle, player.size, 1);

      if(keys.click && frame%10===0 && !player.isDashing) {
         bullets.push({x:player.x, y:player.y-30, vx:0, vy:-15, size:20, emoji:'🔥', dmg:1});
         if(player.level>=2) { bullets.push({x:player.x-10,y:player.y-20,vx:-2,vy:-14,size:15,emoji:'🔥',dmg:1}); bullets.push({x:player.x+10,y:player.y-20,vx:2,vy:-14,size:15,emoji:'🔥',dmg:1}); }
         if(player.level>=3) { bullets.push({x:player.x-20,y:player.y-10,vx:-5,vy:-12,size:15,emoji:'⚡',dmg:1.5}); bullets.push({x:player.x+20,y:player.y-10,vx:5,vy:-12,size:15,emoji:'⚡',dmg:1.5}); }
         playSound('shoot');
      }

      for(let i=bullets.length-1; i>=0; i--) { let b=bullets[i]; b.x+=b.vx*timeScale; b.y+=b.vy*timeScale; ctx.font=`${b.size}px Arial`; ctx.fillText(b.emoji,b.x,b.y); if(b.y<-50) bullets.splice(i,1); }
      
      if(frame%(keys.rightClick?20:60)===0) spawnEnemy();
      for(let i=enemies.length-1; i>=0; i--) {
        let e=enemies[i];
        let sm = keys.rightClick ? 2.5 : 1.0;
        e.y += e.vy*sm*timeScale; e.x+=e.vx*timeScale;
        if(e.type==='shooter') { e.shootT+=timeScale; if(e.shootT>100) { e.shootT=0; let a=Math.atan2(player.y-e.y, player.x-e.x); enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5}); } }
        ctx.font=`${e.size}px Arial`; ctx.fillText(e.emoji, e.x, e.y);
        
        if(!player.isDashing && dist(e.x,e.y,player.x,player.y)<player.size) gameOver();
        for(let j=bullets.length-1; j>=0; j--) {
           if(dist(bullets[j].x, bullets[j].y, e.x, e.y) < e.size) {
             e.hp -= bullets[j].dmg; bullets.splice(j,1);
             if(e.hp<=0) { score+=(e.type==='tank'?100:20)*(keys.rightClick?2:1); orbs.push({x:e.x,y:e.y,vx:rand(-2,2),vy:rand(-2,2)}); enemies.splice(i,1); playSound('explode'); }
             break;
           }
        }
        if(e.y>canvas.height+50) enemies.splice(i,1);
      }

      for(let i=orbs.length-1; i>=0; i--) {
        let o=orbs[i];
        if(dist(o.x,o.y,player.x,player.y)<200) { o.x+=(player.x-o.x)*0.1*timeScale; o.y+=(player.y-o.y)*0.1*timeScale; } else { o.x+=o.vx; o.y+=o.vy; }
        ctx.shadowBlur=10; ctx.shadowColor='cyan'; ctx.fillStyle='#00ffff'; ctx.beginPath(); ctx.arc(o.x,o.y,8,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        if(dist(o.x,o.y,player.x,player.y)<player.size) { 
          player.xp++; score+=5; orbs.splice(i,1); 
          if(player.xp>=player.maxXp) { player.level++; player.xp=0; player.maxXp=Math.floor(player.maxXp*1.5); player.energy=player.maxEnergy; floatText.push({x:player.x,y:player.y-50,t:'LEVEL UP!',l:60}); }
        }
      }
      
      ctx.fillStyle='red';
      for(let i=enemyBullets.length-1; i>=0; i--) { let eb=enemyBullets[i]; eb.x+=eb.vx*timeScale; eb.y+=eb.vy*timeScale; ctx.beginPath(); ctx.arc(eb.x,eb.y,6,0,Math.PI*2); ctx.fill(); if(!player.isDashing && dist(eb.x,eb.y,player.x,player.y)<20) gameOver(); if(eb.y>canvas.height) enemyBullets.splice(i,1); }
      for(let i=particles.length-1; i>=0; i--) { particles[i].update(); particles[i].draw(); if(particles[i].life<=0) particles.splice(i,1); }
      ctx.fillStyle='yellow'; ctx.font='20px Arial';
      for(let i=floatText.length-1; i>=0; i--) { ctx.fillText(floatText[i].t, floatText[i].x, floatText[i].y); floatText[i].y--; floatText[i].l--; if(floatText[i].l<=0) floatText.splice(i,1); }

      ctx.restore();
      updateUI();
      frame++;
      requestAnimationFrame(loop);
    }

    function updateUI() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('levelBadge').innerText = "LVL " + player.level;
      document.getElementById('xp-bar').style.width = (player.xp/player.maxXp*100) + "%";
      document.getElementById('energy-bar').style.width = (player.energy/player.maxEnergy*100) + "%";
      const dashInd = document.getElementById('dashIndicator');
      if(player.dashCooldown <= 0) { dashInd.classList.add('ready'); if(isMobile) btnDash.style.borderColor='cyan'; }
      else { dashInd.classList.remove('ready'); if(isMobile) btnDash.style.borderColor='#555'; }
    }

    function gameOver() {
      gameRunning = false;
      document.getElementById('menu-overlay').classList.remove('hidden');
      document.querySelector('h1').innerText = "SYSTEM FAILURE";
      document.getElementById('startBtn').innerText = "RETRY";
      if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('menu-overlay').classList.add('hidden');
      if(isMobile) enterFullscreen();
      resetGame();
      gameRunning = true;
      loop();
    });

  </script>
</body>
</html>
