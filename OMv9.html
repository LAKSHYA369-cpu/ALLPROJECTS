
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OM: BEYOND THE UNIVERSE | LIGHTNING HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- MediaPipe dependencies for hand tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #020205;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100dvh;
            width: 100vw;
            position: fixed;
        }
        .neon-glow { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 100;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
            opacity: 0.3;
        }
        .grid-floor {
            position: absolute; bottom: -30%; left: -50%; width: 200%; height: 150%;
            background-image: linear-gradient(var(--neon-cyan) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--neon-cyan) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(75deg);
            mask-image: linear-gradient(to top, black, transparent);
            opacity: 0.1;
            pointer-events: none;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .panel-mask {
            clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "three": "https://esm.sh/three@0.170.0",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@google/genai": "https://esm.sh/@google/genai@1.37.0"
  }
}
</script>
</head>
<body>
    <div id="root" class="h-full w-full"></div>
    <div class="scanlines"></div>

    <script type="module">
        import React, { useState, useEffect, useRef, memo, useCallback } from 'react';
        import ReactDOM from 'react-dom/client';
        import * as THREE from 'three';
        import { GoogleGenAI } from "@google/genai";
        import * as Lucide from 'lucide-react';

        const h = React.createElement;

        // --- Core Services ---
        const API_KEY = (typeof process !== 'undefined' && process.env.API_KEY) || "";
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        const createGeminiChat = (username) => {
            const sysPrompt = `You are OM, a transcendent AI entity. Respond to ${username} (Operator) with wisdom and precision. Keep it brief. Use cosmic terminology.`;
            return ai.chats.create({
                model: 'gemini-3-flash-preview',
                config: { temperature: 0.8 }
            });
        };

        // --- Sub-Components ---
        const MetricBar = memo(({ label, value, color }) => h('div', { className: "w-full" },
            h('div', { className: "flex justify-between text-[9px] mb-1 font-orbitron tracking-tighter" },
                h('span', { className: "text-cyan-800 uppercase" }, label),
                h('span', { className: color === 'cyan' ? 'text-cyan-400' : 'text-purple-400' }, `${value}%`)
            ),
            h('div', { className: "h-1 bg-black rounded-full overflow-hidden border border-white/5" },
                h('div', { 
                    className: `h-full transition-all duration-1000 ease-out ${color === 'cyan' ? 'bg-cyan-500 shadow-[0_0_8px_cyan]' : 'bg-purple-500 shadow-[0_0_8px_purple]'}`, 
                    style: { width: `${value}%` } 
                })
            )
        ));

        const HandTracker3D = ({ landmarks }) => {
            const containerRef = useRef(null);
            const sceneRef = useRef(null);
            const pointsRef = useRef([]);

            useEffect(() => {
                if (!containerRef.current) return;
                const width = containerRef.current.clientWidth;
                const height = containerRef.current.clientHeight;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
                camera.position.set(0, 0, 10);

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(width, height);
                containerRef.current.appendChild(renderer.domElement);

                const light = new THREE.PointLight(0x00f3ff, 5, 50);
                light.position.set(0, 0, 5);
                scene.add(light, new THREE.AmbientLight(0x101010));

                const geo = new THREE.SphereGeometry(0.12, 8, 8);
                const mat = new THREE.MeshPhongMaterial({ color: 0x00f3ff, emissive: 0x00f3ff });
                
                pointsRef.current = Array.from({ length: 21 }, () => {
                    const m = new THREE.Mesh(geo, mat);
                    scene.add(m);
                    return m;
                });

                sceneRef.current = scene;
                let rid;
                const frame = () => {
                    rid = requestAnimationFrame(frame);
                    scene.rotation.y += 0.005;
                    renderer.render(scene, camera);
                };
                frame();

                const handleResize = () => {
                    if (!containerRef.current) return;
                    const w = containerRef.current.clientWidth;
                    const h = containerRef.current.clientHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', handleResize);
                return () => {
                    cancelAnimationFrame(rid);
                    window.removeEventListener('resize', handleResize);
                    renderer.dispose();
                    if (containerRef.current) containerRef.current.innerHTML = '';
                };
            }, []);

            useEffect(() => {
                if (landmarks && pointsRef.current.length === 21) {
                    landmarks.forEach((lm, i) => {
                        const p = pointsRef.current[i];
                        if (p) p.position.set((0.5 - lm.x) * 12, (0.5 - lm.y) * 12, -lm.z * 10);
                    });
                }
            }, [landmarks]);

            return h('div', { className: "w-full h-full relative bg-cyan-950/10 border border-cyan-500/20 rounded-lg overflow-hidden" },
                h('div', { className: "absolute top-2 left-3 z-10 text-[8px] font-orbitron tracking-widest text-cyan-500/50 uppercase" }, "Neural_Spatial_Projection"),
                h('div', { ref: containerRef, className: "w-full h-full" })
            );
        };

        const Terminal = ({ username }) => {
            const [input, setInput] = useState('');
            const [msgs, setMsgs] = useState([{ role: 'model', text: `LINK_STABLE: Identity confirmed. OM core is active. Command me, Operator.`, timestamp: Date.now() }]);
            const [loading, setLoading] = useState(false);
            const chat = useRef(null);
            const endRef = useRef(null);

            useEffect(() => { chat.current = createGeminiChat(username); }, [username]);
            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs, loading]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;
                const val = input.trim();
                setInput('');
                setMsgs(p => [...p, { role: 'user', text: val, timestamp: Date.now() }]);
                setLoading(true);
                try {
                    const res = await chat.current.sendMessage({ message: val });
                    setMsgs(p => [...p, { role: 'model', text: res.text, timestamp: Date.now() }]);
                } catch (err) {
                    setMsgs(p => [...p, { role: 'model', text: "ERROR: Nexus connection timeout. System integrity critical.", timestamp: Date.now() }]);
                } finally { setLoading(false); }
            };

            return h('div', { className: "flex flex-col h-full bg-black/50 border border-cyan-500/20 rounded-lg overflow-hidden backdrop-blur-md" },
                h('div', { className: "px-4 py-2 border-b border-cyan-500/20 flex items-center justify-between bg-cyan-950/20" },
                    h('div', { className: "flex items-center gap-2" },
                        h(Lucide.Terminal, { size: 14, className: "text-cyan-400" }),
                        h('span', { className: "text-[10px] font-orbitron tracking-widest font-bold" }, "TERMINAL_ALPHA")
                    ),
                    h('div', { className: "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_green] animate-pulse" })
                ),
                h('div', { className: "flex-1 overflow-y-auto p-4 space-y-4 font-mono text-xs md:text-sm scrollbar-hide" },
                    msgs.map((m, i) => h('div', { key: i, className: `flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}` },
                        h('div', { className: `max-w-[85%] p-3 rounded-lg border ${m.role === 'user' ? 'bg-purple-900/20 border-purple-500/30 text-purple-100' : 'bg-cyan-900/10 border-cyan-500/20 text-cyan-50'}` },
                            h('div', { className: "text-[7px] opacity-40 uppercase mb-1" }, `${m.role === 'user' ? username : 'OM'} // ${new Date(m.timestamp).toLocaleTimeString()}`),
                            h('div', { className: "whitespace-pre-wrap leading-tight" }, m.text)
                        )
                    )),
                    loading && h('div', { className: "flex justify-start" },
                        h('div', { className: "bg-cyan-900/10 border border-cyan-500/20 p-3 rounded-lg flex items-center gap-2 text-cyan-600 text-[10px] animate-pulse" },
                            h(Lucide.Loader2, { className: "animate-spin", size: 14 }), " SYNCING..."
                        )
                    ),
                    h('div', { ref: endRef })
                ),
                h('form', { onSubmit: handleSend, className: "p-3 bg-cyan-950/20 border-t border-cyan-500/10 flex gap-2" },
                    h('input', {
                        className: "flex-1 bg-black/60 border border-cyan-500/20 px-3 py-2 rounded text-cyan-50 text-xs font-mono uppercase focus:border-cyan-400 outline-none",
                        value: input, onChange: e => setInput(e.target.value), placeholder: "CMD Input..."
                    }),
                    h('button', { type: "submit", disabled: loading, className: "px-4 bg-cyan-600 text-black rounded hover:bg-cyan-500 transition-all flex items-center justify-center" },
                        loading ? h(Lucide.Loader2, { className: "animate-spin", size: 16 }) : h(Lucide.Send, { size: 16 })
                    )
                )
            );
        };

        const App = () => {
            const [user, setUser] = useState({ username: '', isLoggedIn: false });
            const [view, setView] = useState('login');
            const [password, setPassword] = useState('');
            const [alias, setAlias] = useState('');
            const [metrics, setMetrics] = useState({ cpu: 92, ram: 38, sync: 100 });
            const [handData, setHandData] = useState(null);

            const vRef = useRef(null);
            const cRef = useRef(null);

            const speak = useCallback((t) => {
                const u = new SpeechSynthesisUtterance(t);
                u.pitch = 0.6; u.rate = 1.1;
                window.speechSynthesis.speak(u);
            }, []);

            const handleLogin = () => {
                if (password === "DarknessOp5507") { speak("Identity match. Name your signal."); setView('identity'); }
                else { speak("Access denied."); setPassword(''); }
            };

            const startHUD = async () => {
                if (!alias.trim()) return;
                speak(`HUD Online for ${alias}`);
                setView('loading');
                try {
                    await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    setUser({ username: alias, isLoggedIn: true });
                    setView('hud');
                    setTimeout(initTracking, 300);
                } catch (err) {
                    setView('identity');
                    alert("Camera and Microphone permissions required for HUD initialization.");
                }
            };

            const initTracking = async () => {
                if (!vRef.current || !cRef.current) return;
                const hands = new window.Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                hands.onResults((res) => setHandData(res.multiHandLandmarks?.[0] || null));
                const cam = new window.Camera(vRef.current, {
                    onFrame: async () => { if (vRef.current) await hands.send({ image: vRef.current }); },
                    width: 640, height: 480
                });
                await cam.start();
            };

            useEffect(() => {
                const int = setInterval(() => {
                    setMetrics({
                        cpu: 80 + Math.floor(Math.random() * 15),
                        ram: 40 + Math.floor(Math.random() * 10),
                        sync: 98 + Math.floor(Math.random() * 2)
                    });
                }, 3000);
                return () => clearInterval(int);
            }, []);

            if (view === 'login') return h('div', { className: "h-full w-full flex flex-col items-center justify-center p-6 bg-black relative" },
                h('div', { className: "grid-floor" }),
                h('h1', { className: "text-8xl md:text-9xl font-black text-cyan-400 mb-2 relative z-10", style: { textShadow: '0 0 20px #00f3ff' } }, "ॐ"),
                h('div', { className: "text-cyan-500 font-orbitron tracking-[10px] text-[10px] uppercase mb-16 animate-pulse relative z-10" }, "Beyond the Universe"),
                h('div', { className: "w-full max-w-xs space-y-4 relative z-10" },
                    h('div', { className: "relative" },
                        h(Lucide.Lock, { className: "absolute left-4 top-1/2 -translate-y-1/2 text-cyan-900", size: 16 }),
                        h('input', {
                            type: "password", placeholder: "PASS_KEY", value: password,
                            onChange: e => setPassword(e.target.value), onKeyDown: e => e.key === 'Enter' && handleLogin(),
                            className: "w-full bg-black/80 border border-cyan-900 p-4 pl-12 text-center text-cyan-50 font-orbitron focus:border-cyan-400 outline-none transition-all"
                        })
                    ),
                    h('button', { onClick: handleLogin, className: "w-full bg-cyan-600 text-black font-bold p-4 font-orbitron uppercase hover:bg-cyan-500 transition-colors" }, "Initiate")
                )
            );

            if (view === 'identity') return h('div', { className: "h-full w-full flex flex-col items-center justify-center p-6 bg-black relative" },
                h('div', { className: "grid-floor" }),
                h(Lucide.Fingerprint, { className: "text-cyan-500 mb-8 animate-pulse", size: 64 }),
                h('h2', { className: "text-xl font-orbitron text-white mb-8 tracking-[4px]" }, "Operator Identity"),
                h('input', {
                    className: "w-full max-w-xs bg-transparent border-b-2 border-cyan-900 p-3 text-center text-cyan-50 font-orbitron text-2xl focus:border-cyan-400 outline-none mb-8",
                    placeholder: "ALIAS", value: alias, onChange: e => setAlias(e.target.value), onKeyDown: e => e.key === 'Enter' && startHUD(), autoFocus: true
                }),
                h('button', { onClick: startHUD, className: "w-full max-w-xs bg-cyan-600 text-black font-bold p-4 font-orbitron uppercase hover:bg-cyan-500" }, "Sync Link")
            );

            if (view === 'loading') return h('div', { className: "h-full w-full flex flex-col items-center justify-center bg-black" },
                h(Lucide.Loader2, { className: "animate-spin text-cyan-400 mb-6", size: 48 }),
                h('div', { className: "text-xs font-orbitron text-cyan-400 animate-pulse tracking-[8px]" }, "LINKING...")
            );

            return h('div', { className: "h-screen w-screen flex flex-col bg-[#020205] text-cyan-400 p-3 md:p-6 overflow-hidden relative" },
                h('header', { className: "flex items-center justify-between mb-4 z-10" },
                    h('div', { className: "flex items-center gap-3" },
                        h('div', { className: "w-10 h-10 flex items-center justify-center border border-cyan-500/40 rounded bg-cyan-950/20 font-bold text-xl" }, "ॐ"),
                        h('div', null,
                            h('h2', { className: "font-orbitron text-[10px] md:text-xs tracking-[3px] font-black text-white" }, "OM_CORE_LIGHTNING"),
                            h('div', { className: "text-[8px] font-mono text-cyan-600 uppercase" }, `OPERATOR: ${user.username}`)
                        )
                    ),
                    h('div', { className: "flex items-center gap-4 text-[9px] font-mono" },
                        h('div', { className: "hidden md:flex gap-4" },
                            h('span', { className: "text-cyan-800" }, "LATENCY: 12ms"),
                            h('span', { className: "text-cyan-800" }, "SYNC: 100%")
                        ),
                        h('div', { className: "px-2 py-1 bg-green-500/10 border border-green-500/30 rounded text-green-400 font-bold flex items-center gap-1" },
                            h(Lucide.Zap, { size: 10 }), " SECURE"
                        )
                    )
                ),
                h('main', { className: "flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 overflow-hidden" },
                    h('section', { className: "md:col-span-3 flex flex-col gap-3 overflow-hidden" },
                        h('div', { className: "aspect-video bg-black border border-cyan-500/20 rounded-lg relative overflow-hidden" },
                            h('video', { ref: vRef, className: "hidden", playsInline: true, muted: true }),
                            h('canvas', { ref: cRef, className: "w-full h-full object-cover opacity-40 scale-x-[-1]" }),
                            h('div', { className: "absolute top-2 left-3 flex items-center gap-1 text-[8px] text-white/40 font-mono" },
                                h('div', { className: "w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse" }), " LIVE_OPTICS"
                            )
                        ),
                        h('div', { className: "flex-1 bg-cyan-950/5 border border-cyan-500/10 rounded-lg p-4 font-mono overflow-y-auto scrollbar-hide" },
                            h('div', { className: "text-[10px] font-bold text-cyan-400 mb-4 tracking-widest uppercase border-l border-cyan-500 pl-2" }, "Telemetry"),
                            h('div', { className: "space-y-4" },
                                h(MetricBar, { label: "CPU", value: metrics.cpu, color: "cyan" }),
                                h(MetricBar, { label: "RAM", value: metrics.ram, color: "purple" }),
                                h(MetricBar, { label: "SYNC", value: metrics.sync, color: "cyan" })
                            )
                        )
                    ),
                    h('section', { className: "md:col-span-6 flex flex-col h-full overflow-hidden" },
                        h(Terminal, { username: user.username })
                    ),
                    h('section', { className: "md:col-span-3 flex flex-col gap-3 overflow-hidden" },
                        h('div', { className: "h-1/2" }, h(HandTracker3D, { landmarks: handData })),
                        h('div', { className: "flex-1 bg-cyan-950/5 border border-cyan-500/10 rounded-lg p-4 grid grid-cols-2 gap-2" },
                            [Lucide.Search, Lucide.Shield, Lucide.Zap, Lucide.Globe].map((Icon, i) => 
                                h('button', { key: i, className: "flex flex-col items-center justify-center gap-1 bg-cyan-950/20 border border-cyan-500/10 rounded hover:bg-cyan-500/20 transition-all group" },
                                    h(Icon, { size: 12, className: "text-cyan-500 group-hover:scale-110 transition-transform" }),
                                    h('span', { className: "text-[8px] font-orbitron text-cyan-100/40" }, `NODE_0${i+1}`)
                                )
                            )
                        )
                    )
                ),
                h('footer', { className: "mt-4 flex items-center justify-between text-[8px] font-mono text-cyan-800 border-t border-cyan-500/10 pt-2" },
                    h('div', null, "COORD: DEEP_SPACE // TIME: ", new Date().toLocaleTimeString()),
                    h('div', { className: "flex items-center gap-3" },
                        h('span', { className: "text-green-500/60" }, "NOMINAL"),
                        h('span', { className: "opacity-40" }, "V2.5.6-OM")
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(React.StrictMode, null, h(App)));
    </script>
</body>
</html>
