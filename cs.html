<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Studio Code - Pro Simulator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-monokai.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #1e1e1e;
            --side: #252526;
            --act: #333333;
            --status: #007acc;
            --border: #3c3c3c;
            --text: #cccccc;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }

        /* --- Setup Screen --- */
        #setup {
            position: fixed; inset: 0; background: #111; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        #setup textarea { width: 70%; height: 300px; background: #222; color: #0f0; border: 1px solid #444; padding: 10px; font-family: monospace; border-radius: 4px; }
        #setup input { padding: 10px; width: 300px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; }
        #setup button { padding: 12px 40px; background: #007acc; border: none; color: white; cursor: pointer; font-weight: bold; margin-top: 15px; }

        /* --- VS Code Layout --- */
        .vscode-window { display: flex; flex-direction: column; height: 100vh; visibility: hidden; }
        
        /* Title Bar */
        .title-bar { height: 30px; background: #3c3c3c; display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: #999; }
        .menu-items { display: flex; gap: 15px; margin-left: 20px; }

        .main-content { display: flex; flex: 1; overflow: hidden; }

        /* Activity Bar (Icons on Left) */
        .activity-bar { width: 48px; background: var(--act); display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 15px; }
        .act-icon { width: 24px; height: 24px; opacity: 0.6; cursor: pointer; }
        .act-icon.active { opacity: 1; border-left: 2px solid white; }

        /* Sidebar */
        .sidebar { width: 240px; background: var(--side); border-right: 1px solid var(--border); }
        .sidebar-header { padding: 10px 20px; font-size: 11px; text-transform: uppercase; color: #bbb; font-weight: bold; }
        .file-item { padding: 5px 20px; font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 8px; background: #37373d; }

        /* Editor Section */
        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        .tabs { display: flex; background: #252526; height: 35px; border-bottom: 1px solid #1a1a1a; }
        .tab { background: var(--bg); padding: 0 20px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid #1a1a1a; color: white; border-top: 1px solid #007acc; }
        
        .breadcrumbs { height: 22px; padding: 2px 20px; font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; }

        #editor-scroll { flex: 1; overflow-y: auto; padding: 10px; position: relative; }
        pre[class*="language-"] { margin: 0; padding: 0; background: transparent !important; font-size: 15px; font-family: 'Consolas', monospace; line-height: 1.6; pointer-events: none; }
        code { white-space: pre-wrap !important; word-break: break-all; }

        /* Custom Cursor */
        .custom-cursor { display: inline-block; width: 2px; height: 1.2em; background: #aeafad; animation: blink 0.8s infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Status Bar */
        .status-bar { height: 22px; background: var(--status); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <div id="setup">
        <h1 style="margin-bottom: 5px;">VS Code Simulator Pro</h1>
        <p style="color: #888; margin-bottom: 20px;">Ready for YouTube Screen Recording</p>
        <input type="text" id="fname" placeholder="Filename (e.g. main.py, index.html, style.css)">
        <textarea id="rawCode" placeholder="Paste your full code here..."></textarea>
        <button onclick="bootVSCode()">Generate VS Code Environment</button>
    </div>

    <div class="vscode-window" id="app">
        <div class="title-bar">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Visual_Studio_Code_1.35_icon.svg" width="15">
            <div class="menu-items">
                <span>File</span><span>Edit</span><span>Selection</span><span>View</span><span>Go</span><span>Run</span><span>Terminal</span><span>Help</span>
            </div>
            <div style="margin-left: auto;">[Filename] - Visual Studio Code</div>
        </div>

        <div class="main-content">
            <div class="activity-bar">
                <img src="https://raw.githubusercontent.com/microsoft/vscode-icons/master/icons/light/files.svg" class="act-icon active">
                <img src="https://raw.githubusercontent.com/microsoft/vscode-icons/master/icons/light/search.svg" class="act-icon">
                <img src="https://raw.githubusercontent.com/microsoft/vscode-icons/master/icons/light/source-control.svg" class="act-icon">
                <img src="https://raw.githubusercontent.com/microsoft/vscode-icons/master/icons/light/debug.svg" class="act-icon">
                <img src="https://raw.githubusercontent.com/microsoft/vscode-icons/master/icons/light/extensions.svg" class="act-icon">
            </div>

            <div class="sidebar">
                <div class="sidebar-header">Explorer</div>
                <div class="file-item" id="side-fn">index.html</div>
            </div>

            <div class="editor-container">
                <div class="tabs">
                    <div class="tab" id="tab-fn">index.html</div>
                </div>
                <div class="breadcrumbs" id="b-crumb">src > folder > file</div>
                
                <div id="editor-scroll">
                    <pre><code id="code-box" class="language-javascript"></code><span class="custom-cursor"></span></pre>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div>Main* 0↓ 0↑</div>
            <div style="display: flex; gap: 15px;">
                <span>Ln 1, Col 1</span>
                <span>Spaces: 4</span>
                <span>UTF-8</span>
                <span>Prettier ✓</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

    <script>
        function bootVSCode() {
            const code = document.getElementById('rawCode').value;
            const filename = document.getElementById('fname').value || 'script.js';
            const extension = filename.split('.').pop();

            if(!code) return alert("Code toh dalo bhai!");

            // Setup UI strings
            document.getElementById('side-fn').innerText = "📄 " + filename;
            document.getElementById('tab-fn').innerText = filename;
            document.getElementById('b-crumb').innerText = "project > src > " + filename;
            document.getElementById('code-box').className = `language-${extension}`;

            document.getElementById('setup').style.display = 'none';
            document.getElementById('app').style.visibility = 'visible';

            startHumanTyping(code);
        }

        async function startHumanTyping(fullCode) {
            const codeBox = document.getElementById('code-box');
            const scrollArea = document.getElementById('editor-scroll');
            let currentText = "";
            let i = 0;

            function type() {
                if (i < fullCode.length) {
                    currentText += fullCode[i];
                    codeBox.textContent = currentText;
                    
                    // Trigger Syntax Highlighting
                    Prism.highlightElement(codeBox);

                    // Auto-scroll
                    scrollArea.scrollTop = scrollArea.scrollHeight;

                    // Human Logic: Pauses & Bursts
                    let char = fullCode[i];
                    let speed = Math.random() * 40 + 20; // Default speed

                    if (char === '\n') speed = 300 + Math.random() * 500; // New line pause
                    if (char === '{' || char === '(') speed = 200; // Logic thinking pause
                    if (Math.random() > 0.97) speed = 800; // "Thinking" long pause

                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }
    </script>
</body>
</html>
