<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Quality PC Audio Sync</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        button { background: #3b82f6; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; transform: scale(1.05); }
        .status { margin-top: 15px; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Wireless Earbuds Sync</h2>
        <p>PC ki awaaz earbuds mein sunne ke liye niche click karein</p>
        <button id="playBtn">Connect & Play</button>
        <div id="status" class="status">Status: Ready</div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        
        playBtn.addEventListener('click', () => {
            // Yahan 'YOUR_PC_IP' ki jagah apna IPv4 address likhein (e.g. 192.168.1.5)
            const pc_ip = "10.140.94.98"; 
            const audio = new Audio(`http://${pc_ip}:8000/stream`);
            
            status.innerText = "Connecting...";
            
            audio.play().then(() => {
                status.innerText = "Connected! Awaaz aa rahi hai.";
                playBtn.style.background = "#10b981";
                playBtn.innerText = "Streaming Live...";
            }).catch(err => {
                status.innerText = "Error: Check if Python app is running!";
                console.error(err);
            });
        });
    </script>
</body>
</html>
