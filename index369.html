<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ultra HD Webcam (Optimized)</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #007bff;
            --usb-color: #28a745;
            --danger: #dc3545;
            --rec-color: #ff4757;
            --bg: #000000; /* Lightning fast performance ke liye dark theme */
            --card: #111111;
            --accent: #00d4ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Scrollbars ko hide karein */
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        /* --- PC RECEIVER FULLSCREEN UI --- */
        #pc-container {
            display: none; /* Default mein hidden */
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #webcamView {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Video screen ko full fill karega */
            background: #000;
        }

        #pc-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
        }

        /* --- PHONE BROADCASTER & INITIAL UI --- */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .phone-video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 9/16; /* Portrait view for phone */
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #333;
            margin-bottom: 20px;
            display: none; /* Initially hidden */
        }

        #phonePreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #wirelessBtn { background: var(--primary); color: white; }
        #usbBtn { background: var(--usb-color); color: white; }
        #qrBtn { background: #6f42c1; color: white; }
        #stopBtn, #stopPhoneBtn { background: var(--danger); color: white; display: none; }
        
        button small { display: block; font-size: 11px; opacity: 0.8; margin-top: 2px; }

        /* Media Controls Buttons */
        .media-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
            display: none; /* Initially hidden */
        }

        #photoBtn { background: #57606f; color: white; }
        #recordBtn { background: var(--rec-color); color: white; }
        #recordBtn.recording { animation: pulse 1.5s infinite; }

        @keyframes pulse { 50% { opacity: 0.5; } }

        /* QR Code Styling */
        #qr-box {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: none;
        }

        /* Status & UI Overlays */
        #init-ui { display: flex; flex-direction: column; align-items: center; }
        
        .placeholder-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 1.2rem;
        }

        .status-bar {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #aaa;
            z-index: 100;
        }
        .live-tag { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-bar">ID: <span id="peer-id">---</span> | <span id="statusText">Init</span></div>

    <div class="container" id="init-ui">
        <h1>Pro HD Webcam</h1>
        <p style="color: #aaa; margin-bottom: 30px;">Ultra-fast Wireless/USB Camera</p>
        
        <div class="btn-group">
            <button id="qrBtn">Generate Pairing QR</button>
        </div>

        <div id="qr-box">
            <div id="qrcode"></div>
            <p style="color: #333; margin: 10px 0 0 0; font-weight: bold; font-size: 14px;">Scan with Phone Camera</p>
        </div>
    </div>

    <div id="pc-container">
        <video id="webcamView" autoplay playsinline muted></video>
        <div class="placeholder-text" id="pc-placeholder">Waiting for stream...</div>
        <div id="pc-controls">
            <button id="stopBtn" style="width: auto; padding: 10px 20px;">Disconnect</button>
        </div>
    </div>

    <div class="container" id="phone-ui" style="display: none;">
        <h2>Broadcaster Mode</h2>
        
        <div class="phone-video-container">
            <video id="phonePreview" autoplay playsinline muted></video>
        </div>

        <div class="btn-group" id="phone-conn-controls">
            <button id="wirelessBtn">Connect Wirelessly<small>Standard HD Quality</small></button>
            <button id="usbBtn">Connect via USB<small>(Best Quality & Lowest Latency)</small></button>
        </div>

        <div class="btn-group">
            <div class="media-controls" id="phone-media-controls">
                <button id="photoBtn">📸 Take Photo</button>
                <button id="recordBtn">🔴 Record Video</button>
            </div>
            <button id="stopPhoneBtn">Stop Stream</button>
        </div>
    </div>

<script>
    // --- GLOBAL SETUP & OPTIMIZATION ---
    const peer = new Peer(null, { debug: 1 }); // Performance ke liye low debug level
    const statusText = document.getElementById('statusText');
    const peerIdElem = document.getElementById('peer-id');
    
    // Performance Optimization: Pre-request HD constraints
    const highQualityConstraints = {
        video: {
            facingMode: "environment", // Default back camera
            width: { ideal: 1920, max: 1920 }, // Full HD request
            height: { ideal: 1080, max: 1080 },
            frameRate: { ideal: 30, max: 60 } // Smooth video
        },
        audio: {
            echoCancellation: true,
            noiseSuppression: true,
            sampleRate: 48000
        }
    };

    // UI elements tracking
    let currentStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // --- INITIALIZATION ---
    peer.on('open', (id) => {
        peerIdElem.innerText = id;
        statusText.innerText = "Online";
    });

    peer.on('error', (err) => {
        console.error("PeerJS Error:", err);
        statusText.innerText = "Error";
        alert("Connection Error: " + err.type);
    });

    // --- URL PARAMETER ROUTING (Bug Fix) ---
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('target');

    if (targetPeerId) {
        // Phone Mode: Show Phone UI, Hide Initial/PC UI
        document.getElementById('init-ui').style.display = 'none';
        document.getElementById('pc-container').style.display = 'none';
        document.getElementById('phone-ui').style.display = 'flex';
        document.querySelector('.phone-video-container').style.display = 'block';
        setupPhoneMode();
    } else {
        // PC Mode: Initially show Initial UI (QR gen)
        document.getElementById('pc-container').style.display = 'none';
        setupPcMode();
    }

    // --- PC MODE LOGIC (Receiver) ---
    function setupPcMode() {
        const qrBtn = document.getElementById('qrBtn');
        const qrBox = document.getElementById('qr-box');
        const pcContainer = document.getElementById('pc-container');
        const initUi = document.getElementById('init-ui');
        const videoElem = document.getElementById('webcamView');
        const placeholder = document.getElementById('pc-placeholder');
        const stopBtn = document.getElementById('stopBtn');

        // 1. QR Generation
        qrBtn.addEventListener('click', () => {
            const id = peerIdElem.innerText;
            if(id === "---") return alert("Waiting for ID...");
            
            qrBox.style.display = 'block';
            document.getElementById('qrcode').innerHTML = "";
            const phoneUrl = `${window.location.href}?target=${id}`;
            new QRCode(document.getElementById("qrcode"), {
                text: phoneUrl, width: 200, height: 200, correctLevel : QRCode.CorrectLevel.H
            });
        });

        // 2. Incoming Call Handling (Bug Fixes & Fullscreen)
        peer.on('call', (call) => {
            statusText.innerHTML = '<span class="live-tag">● LIVE</span>';
            
            // UI Switch to Fullscreen Video
            initUi.style.display = 'none';
            pcContainer.style.display = 'block';
            stopBtn.style.display = 'block';

            // Answer call automatically
            call.answer(); 

            call.on('stream', (remoteStream) => {
                videoElem.srcObject = remoteStream;
                placeholder.style.display = 'none';
            });

            call.on('close', closeConnection);
            call.on('error', closeConnection);
        });

        stopBtn.addEventListener('click', closeConnection);

        function closeConnection() {
            if(videoElem.srcObject) {
                videoElem.srcObject.getTracks().forEach(track => track.stop());
                videoElem.srcObject = null;
            }
            location.href = window.location.pathname; // Full reset
        }
    }

    // --- PHONE MODE LOGIC (Broadcaster with Recording/Photo) ---
    function setupPhoneMode() {
        const videoPreview = document.getElementById('phonePreview');
        const connControls = document.getElementById('phone-conn-controls');
        const mediaControls = document.getElementById('phone-media-controls');
        const stopPhoneBtn = document.getElementById('stopPhoneBtn');
        
        const photoBtn = document.getElementById('photoBtn');
        const recordBtn = document.getElementById('recordBtn');

        // 1. Media Acquisition & Streaming
        async function startStreaming(isUSB) {
            try {
                // Pre-connection check
                if(peerIdElem.innerText === "---") {
                    alert("Phone not yet registered online. Please wait a moment.");
                    return;
                }

                connControls.style.display = 'none'; // Buttons hide karein duplicate clicks bachane ke liye

                // Optimize for USB latency if selected (Browser dependent)
                if(isUSB) {
                    highQualityConstraints.video.frameRate = { ideal: 60 };
                    console.log("Optimizing for USB (Higher Frame Rate requested)");
                }

                statusText.innerText = "Acquiring Camera...";
                currentStream = await navigator.mediaDevices.getUserMedia(highQualityConstraints);
                videoPreview.srcObject = currentStream;
                
                statusText.innerText = `Connecting to PC...`;
                const call = peer.call(targetPeerId, currentStream);

                call.on('open', () => {
                    statusText.innerHTML = `<span class="live-tag">● ${isUSB ? 'USB' : 'WIFI'} STREAMING</span>`;
                    mediaControls.style.display = 'grid'; // Show Photo/Record
                    stopPhoneBtn.style.display = 'block';
                    
                    // Setup MediaRecorder for recording feature
                    setupRecording(currentStream);
                });

                call.on('close', () => location.href = window.location.pathname);
                call.on('error', (err) => {
                    alert("Stream Error: " + err);
                    location.href = window.location.pathname;
                });

            } catch (err) {
                console.error("Camera Error:", err);
                alert(`Cannot access high-quality camera: ${err.message}\nEnsure HTTPS is used and permission granted.`);
                connControls.style.display = 'flex'; // Re-show buttons on failure
                statusText.innerText = "Camera Failed";
            }
        }

        document.getElementById('wirelessBtn').addEventListener('click', () => startStreaming(false));
        document.getElementById('usbBtn').addEventListener('click', () => startStreaming(true));
        
        stopPhoneBtn.addEventListener('click', () => {
             if(currentStream) currentStream.getTracks().forEach(track => track.stop());
             location.href = window.location.pathname;
        });

        // 2. Click Picture Feature
        photoBtn.addEventListener('click', () => {
            if(!currentStream) return;
            const videoTrack = currentStream.getVideoTracks()[0];
            const imageCapture = new ImageCapture(videoTrack);
            
            imageCapture.takePhoto()
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `webcam_photo_${Date.now()}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    alert("Photo saved!");
                })
                .catch(err => alert("Error taking photo: " + err));
        });

        // 3. Record Video Feature
        function setupRecording(stream) {
            const options = { mimeType: 'video/webm;codecs=vp9,opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm'; // Fallback
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                console.error("MediaRecorder setup failed:", e);
                recordBtn.disabled = true;
                recordBtn.innerText = "Rec Not Supported";
                return;
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                recordedChunks = [];
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `webcam_recording_${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                alert("Recording saved!");
            };
        }

        recordBtn.addEventListener('click', () => {
            if(!mediaRecorder) return;

            if (!isRecording) {
                // Start Recording
                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "▇ Stop Recording";
                recordBtn.classList.add('recording');
            } else {
                // Stop Recording
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Record Video";
                recordBtn.classList.remove('recording');
            }
        });
    }

</script>
</body>
</html>
