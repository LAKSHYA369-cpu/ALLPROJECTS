<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Agent Studio v6.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --accent: #00f2fe; --bg: #010409; --panel: #0d1117; --border: #30363d; --hover: #161b22; }
        body { margin: 0; font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bg); color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar & Shape List */
        #sidebar { width: 320px; background: #000; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .shape-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-right: 5px; }
        .shape-item { 
            padding: 10px 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; 
            cursor: pointer; font-size: 13px; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .shape-item:hover { border-color: var(--accent); background: var(--hover); transform: translateX(5px); }
        .shape-item.active { border-color: var(--accent); background: rgba(0, 242, 254, 0.05); color: var(--accent); }
        
        main { flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(circle at 50% 0%, #161b22 0%, #010409 100%); }
        
        .glass { background: var(--panel); border-radius: 12px; border: 1px solid var(--border); padding: 18px; }
        .grid-ui { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: end; }
        
        label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; letter-spacing: 1px; }
        input, textarea, select { background: #161b22; border: 1px solid var(--border); color: #f0f6fc; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        
        #stage { position: relative; width: 100%; flex-grow: 1; border-radius: 20px; background: #000; border: 1px solid var(--border); overflow: hidden; }
        #overlay { position: absolute; top: 20px; left: 20px; font-family: monospace; font-size: 12px; color: var(--accent); pointer-events: none; }
        
        .color-well { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; border: 2px solid var(--border); cursor: pointer; }
        input[type="color"] { border: none; width: 150%; height: 150%; transform: translate(-20%, -20%); cursor: pointer; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<aside id="sidebar">
    <h2 style="margin:0 0 10px 0; font-size: 18px;">AGENT<span style="color:var(--accent)">_STUDIO</span></h2>
    
    <label>Geometry Library</label>
    <div class="shape-list" id="shapeList">
        <!-- Generated by JS -->
    </div>

    <div class="glass" style="margin-top:auto">
        <label>Visual Mode</label>
        <select id="vMode" onchange="Engine.rebuild()">
            <option value="wireframe">Holographic</option>
            <option value="solid">Chrome</option>
            <option value="points">Points</option>
        </select>
    </div>
</aside>

<main>
    <div class="glass">
        <div class="grid-ui">
            <div>
                <label>Auth Token</label>
                <input type="password" id="apiKey" placeholder="Authentication Key..." onchange="saveKey()">
            </div>
            <div>
                <label>Chroma</label>
                <div class="color-well"><input type="color" id="mColor" value="#00f2fe" oninput="Engine.updateLook()"></div>
            </div>
        </div>
        <div style="margin-top: 15px;">
            <label>Neural Command Line</label>
            <textarea id="prompt" rows="1" placeholder="Type a shape name or click one on the left..." oninput="Engine.parseInput()"></textarea>
        </div>
    </div>

    <div id="stage">
        <div id="overlay">ENGINE::STANDBY_</div>
    </div>
</main>

<script>
const Engine = {
    state: { scene: null, camera: null, renderer: null, mesh: null, clock: new THREE.Clock(), active: null },
    
    // 1. Shapes Library
    lib: {
        cube: () => new THREE.BoxGeometry(1, 1, 1),
        sphere: () => new THREE.SphereGeometry(0.8, 64, 64),
        knot: () => new THREE.TorusKnotGeometry(0.5, 0.18, 200, 32),
        capsule: () => new THREE.CapsuleGeometry(0.5, 1, 10, 20),
        diamond: () => new THREE.OctahedronGeometry(1.2),
        donut: () => new THREE.TorusGeometry(0.7, 0.3, 16, 100),
        pyramid: () => new THREE.ConeGeometry(1, 1.5, 4),
        dodeca: () => new THREE.DodecahedronGeometry(1),
        icosa: () => new THREE.IcosahedronGeometry(1),
        cylinder: () => new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32),
        torus: () => new THREE.TorusGeometry(0.8, 0.2, 16, 100)
    },

    // 2. Dynamic Sidebar Generation
    setupUI() {
        const list = document.getElementById('shapeList');
        Object.keys(this.lib).forEach(name => {
            const div = document.createElement('div');
            div.className = 'shape-item';
            div.id = `item-${name}`;
            div.innerHTML = `<span>${name.toUpperCase()}</span><span style="opacity:0.3; font-size:9px;">OBJ</span>`;
            div.onclick = () => {
                document.getElementById('prompt').value = name;
                this.build(name);
            };
            list.appendChild(div);
        });
    },

    init() {
        if (this.state.scene) return;
        const container = document.getElementById('stage');
        
        this.state.scene = new THREE.Scene();
        this.state.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        this.state.camera.position.set(3, 3, 3);
        this.state.camera.lookAt(0,0,0);

        this.state.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.state.renderer.setSize(container.clientWidth, container.clientHeight);
        this.state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(this.state.renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 2);
        light.position.set(5, 5, 5);
        this.state.scene.add(new THREE.AmbientLight(0xffffff, 0.4), light);

        this.loop();
        window.addEventListener('resize', () => this.resize());
    },

    parseInput() {
        const val = document.getElementById('prompt').value.toLowerCase();
        const found = Object.keys(this.lib).find(k => val.includes(k));
        if (found && found !== this.state.active) this.build(found);
    },

    build(name) {
        this.init();
        
        // Clean up previous to prevent memory leaks
        if (this.state.mesh) {
            this.state.mesh.geometry.dispose();
            this.state.mesh.material.dispose();
            this.state.scene.remove(this.state.mesh);
        }

        // Highlight Active UI
        document.querySelectorAll('.shape-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`item-${name}`).classList.add('active');

        const mode = document.getElementById('vMode').value;
        const color = document.getElementById('mColor').value;

        if (mode === 'points') {
            const mat = new THREE.PointsMaterial({ color: color, size: 0.02 });
            this.state.mesh = new THREE.Points(this.lib[name](), mat);
        } else {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                wireframe: mode === 'wireframe',
                metalness: 0.8,
                roughness: 0.2,
                emissive: mode === 'wireframe' ? color : 0x000000,
                emissiveIntensity: 0.5
            });
            this.state.mesh = new THREE.Mesh(this.lib[name](), mat);
        }

        this.state.scene.add(this.state.mesh);
        this.state.active = name;
        document.getElementById('overlay').innerHTML = `ACTIVE_TARGET: ${name.toUpperCase()}<br>RENDER_MODE: ${mode.toUpperCase()}`;
    },

    rebuild() { if(this.state.active) this.build(this.state.active); },

    updateLook() {
        const c = document.getElementById('mColor').value;
        if (this.state.mesh) {
            this.state.mesh.material.color.set(c);
            if(this.state.mesh.material.emissive) this.state.mesh.material.emissive.set(c);
        }
    },

    resize() {
        const c = document.getElementById('stage');
        this.state.camera.aspect = c.clientWidth / c.clientHeight;
        this.state.camera.updateProjectionMatrix();
        this.state.renderer.setSize(c.clientWidth, c.clientHeight);
    },

    loop() {
        requestAnimationFrame(() => this.loop());
        const d = this.state.clock.getDelta();
        if (this.state.mesh) {
            this.state.mesh.rotation.y += 0.4 * d;
            this.state.mesh.rotation.z += 0.2 * d;
            this.state.mesh.position.y = Math.sin(Date.now() * 0.002) * 0.1;
        }
        this.state.renderer.render(this.state.scene, this.state.camera);
    }
};

function saveKey() { localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value); }

window.onload = () => {
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    Engine.setupUI();
    Engine.init();
};
</script>

</body>
</html>
