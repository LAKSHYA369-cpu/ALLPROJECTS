<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Smash Verse">
    <meta property="og:description" content="Fighting game">
    <meta property="og:image" content="https://is.gd/87gIgT">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">>
    <title>Smash Verse: MOBILE</title>
    
    <!-- IMPORTS -->
    <script type="importmap">
        { "imports": { 
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js", 
            "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js", 
            "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js", 
            "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/RenderPass.js", 
            "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js" 
        }}
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root { --primary: #00ffff; --danger: #ff3333; --gold: #ffd700; --bg: #050505; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; width: 100vw; height: 100vh; }
        
        #gl-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* --- MOBILE ORIENTATION LOCK --- */
        #rotate-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
        /* Show rotate screen if portrait */
        @media only screen and (orientation: portrait) { #rotate-screen { display: flex; } }
        .hidden { display: none !important; }

        /* --- SCREENS --- */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,10,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; backdrop-filter: blur(15px); transition: 0.3s; padding-bottom: env(safe-area-inset-bottom); }
        
        h1 { font-size: 8vh; margin: 0; color: transparent; -webkit-text-stroke: 1px var(--primary); text-shadow: 0 0 20px var(--primary); font-style: italic; letter-spacing: -2px; animation: glow 2s infinite alternate; }
        h2 { color: var(--gold); margin-bottom: 2vh; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; font-size: 3vh; }
        @keyframes glow { from { text-shadow: 0 0 10px var(--primary); } to { text-shadow: 0 0 40px var(--primary), 0 0 20px white; } }
        
        /* --- RESPONSIVE BUTTONS --- */
        .btn { position: relative; background: linear-gradient(45deg, rgba(0,255,255,0.1), rgba(0,0,0,0)); color: var(--primary); border: 1px solid var(--primary); padding: 10px 30px; font-size: 3vh; font-weight: 800; margin: 1vh; cursor: pointer; width: 40vw; max-width: 300px; text-transform: uppercase; clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%); transition: 0.2s; }
        .btn:hover { background: var(--primary); color: black; transform: scale(1.05); }
        .btn-red { border-color: var(--danger); color: var(--danger); }
        .btn-close { position: absolute; top: 20px; right: 20px; width: 50px; padding: 5px; clip-path: none; border-radius: 5px; }

        .input-style { padding: 10px; width: 40vw; max-width: 300px; background: rgba(0,0,0,0.5); border: 2px solid var(--primary); color: white; font-size: 3vh; text-align: center; margin-bottom: 10px; border-radius: 5px; font-weight: bold; }

        /* --- HUD (Game Interface) --- */
        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; display: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        
        #top-bar { position: absolute; top: 10px; width: 100%; display: flex; justify-content: center; gap: 20px; pointer-events: none; }
        .hud-stat { font-size: 3vh; font-weight: 900; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 4px; border-left: 3px solid white; transform: skew(-10deg); }
        
        /* --- CONTROLS ADAPTIVE SIZE --- */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 50%; pointer-events: auto; touch-action: none; display: none; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(0, 255, 255, 0.4); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; border: 2px solid white; }
        
        .act-btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; border: 3px solid white; box-shadow: 0 4px 0 rgba(0,0,0,0.5); font-size: 20px; backdrop-filter: blur(5px); transition: transform 0.1s; pointer-events: auto; user-select: none; }
        .act-btn:active { transform: translateY(4px); opacity: 0.8; }
        
        /* Default Positions */
        #btn-atk { bottom: 30px; right: 30px; background: linear-gradient(135deg, #ff3333, #aa0000); width: 85px; height: 85px; font-size: 30px; }
        #btn-kick { bottom: 30px; right: 130px; background: linear-gradient(135deg, #ff8800, #cc4400); }
        #btn-jmp { bottom: 130px; right: 40px; background: linear-gradient(135deg, #33ff33, #00aa00); }
        #btn-dsh { bottom: 130px; right: 130px; background: linear-gradient(135deg, #ffaa00, #cc8800); }

        /* --- MOBILE SPECIFIC SCALING (The Magic Fix) --- */
        @media only screen and (max-height: 500px) {
            /* Shrink controls for landscape phones */
            #joystick-zone { width: 100px; height: 100px; bottom: 20px; left: 20px; }
            #joystick-knob { width: 35px; height: 35px; }
            
            .act-btn { width: 55px; height: 55px; font-size: 16px; }
            #btn-atk { width: 70px; height: 70px; bottom: 20px; right: 20px; font-size: 24px; }
            #btn-kick { bottom: 20px; right: 100px; }
            #btn-jmp { bottom: 90px; right: 25px; }
            #btn-dsh { bottom: 90px; right: 100px; }
            
            h1 { font-size: 12vh; }
            .btn { padding: 5px 20px; font-size: 16px; width: 45vw; margin: 5px; }
            .input-style { font-size: 16px; padding: 8px; }
        }

        #shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; max-height: 50vh; overflow-y: auto; width: 90%; padding: 5px; }
        .shop-item { background: rgba(255,255,255,0.05); padding: 10px; border: 1px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; }
        .shop-item.selected { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }

        #notif { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 5px 30px; font-size: 20px; border-top: 2px solid white; border-bottom: 2px solid white; display: none; z-index: 300; pointer-events: none; font-weight: 900; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .dmg-text { position: absolute; font-weight: 900; font-size: 24px; pointer-events: none; text-shadow: 2px 2px 0 #000; animation: floatUp 0.8s forwards; color: white; z-index: 200; }
        @keyframes floatUp { 0% { opacity:1; transform:translate(-50%, 0); } 100% { opacity:0; transform:translate(-50%, -60px); } }
    </style>
</head>
<body>
    <canvas id="gl-canvas"></canvas>
    
    <!-- ROTATE MESSAGE -->
    <div id="rotate-screen"><div style="font-size:60px; margin-bottom:10px;">📱</div><h2>ROTATE TO LANDSCAPE</h2></div>
    
    <div id="notif">NOTIFICATION</div>

    <!-- HUD -->
    <div id="hud-layer">
        <div id="top-bar">
            <div class="hud-stat" style="border-color:#ff5555; color:#ff5555;">HP <span id="hp-val">100</span></div>
            <div class="hud-stat" style="border-color:white; color:white;">K <span id="kill-val">0</span></div>
            <div class="hud-stat" style="border-color:gold; color:gold;">G <span id="coin-val">0</span></div>
        </div>
        
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        
        <div class="act-btn" id="btn-jmp">J</div>
        <div class="act-btn" id="btn-kick">K</div>
        <div class="act-btn" id="btn-dsh">D</div>
        <div class="act-btn" id="btn-atk">⚔️</div>
    </div>

    <!-- LOGIN -->
    <div id="login-screen" class="screen">
        <h1>SMASH VERSE</h1>
        <h2>WARRIOR NAME</h2>
        <input type="text" id="username-input" class="input-style" placeholder="Name" maxlength="12">
        <button class="btn" onclick="submitLogin()">ENTER GAME</button>
    </div>

    <!-- MENU -->
    <div id="menu-screen" class="screen hidden">
        <h1>SMASH VERSE</h1>
        <h2 id="welcome-msg">WELCOME</h2>
        
        <div style="display: flex; gap: 5px;">
            <button class="btn" onclick="startSinglePlayer()">SINGLE</button>
            <button class="btn" style="border-color: gold; color: gold;" onclick="showScreen('multiplayer-screen')">ONLINE</button>
        </div>

        <button class="btn" onclick="showScreen('shop-screen')">HEROES</button>
        
        <div style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
            <input type="text" id="secret-code" class="input-style" placeholder="Code" style="font-size: 14px; width: 30vw;">
            <button class="btn" style="width: 15vw; padding: 10px;" onclick="redeemCode()">OK</button>
        </div>
    </div>

    <!-- MULTIPLAYER -->
    <div id="multiplayer-screen" class="screen hidden">
        <button class="btn btn-close btn-red" onclick="showScreen('menu-screen')">X</button>
        <h2>LOBBY</h2>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width: 100%;">
            <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; border:1px solid #444;">
                <input type="number" id="create-code-input" class="input-style" placeholder="1234">
                <button class="btn" style="margin:5px 0" onclick="createRoom()">HOST</button>
            </div>
            <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; border:1px solid #444;">
                <input type="number" id="join-code-input" class="input-style" placeholder="1234">
                <button class="btn" style="margin:5px 0" onclick="joinRoom()">JOIN</button>
            </div>
        </div>
        <div class="loader" id="mp-loader"></div>
        <div id="mp-status" style="color:cyan; margin-top:10px; font-weight:bold;"></div>
    </div>

    <!-- SHOP -->
    <div id="shop-screen" class="screen hidden">
        <button class="btn btn-close btn-red" onclick="showScreen('menu-screen')">X</button>
        <h2>HEROES</h2><p>Gems: <span id="shop-coins">0</span></p>
        <div id="shop-grid"></div>
    </div>

    <div id="gameover-screen" class="screen hidden">
        <h1 style="color:red">DEFEATED</h1>
        <button class="btn" onclick="location.reload()">RESTART</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';

        // --- VARS ---
        let gameActive = false;
        let mode = 'single'; 
        let myName = "Player";
        let localPlayer, remotePlayer;
        let enemies = [], particles = [];
        let p1 = { x:0, z:0, vx:0, vz:0, vy:0, hp:100, isAir:false, isAtk:false, skin:'green', coins:0, kills:0 };
        let p2 = { x:0, z:0, rot:0, skin:'green', isAtk:false }; 
        let keys = {}, joystick = {on:false, dx:0, dy:0};
        
        let peer, conn;
        const PREFIX = "sv_mobile_v5_";

        // --- SKINS ---
        let skins = [
            { id: 'green', name: 'Deku', price: 0, color: 0x2ecc71 },
            { id: 'goku', name: 'Goku', price: 500, color: 0xff8800 },
            { id: 'hulk', name: 'Hulk', price: 7000, color: 0x32CD32 },
            { id: 'eren', name: 'Titan', price: 2000, color: 0x8b4513 },
            { id: 'naruto', name: 'Naruto', price: 5000, color: 0xffaa00 },
            { id: 'luffy', name: 'Luffy', price: 5000, color: 0xffffff },
            { id: 'jinwoo', name: 'JinWoo', price: 6000, color: 0x9933ff },
            { id: 'ichigo', name: 'Ichigo', price: 4000, color: 0x111111 },
            { id: 'gojo', name: 'Gojo', price: 2000, color: 0x111122 },
            { id: 'gold', name: 'Golden', price: 1000, color: 0xffd700 },
            { id: 'saitama', name: 'Saitama', price: 8000, color: 0xffff00 }
        ];

        let unlocked = ['green'];
        if(localStorage.getItem('sv_mobile_save')){
            const d = JSON.parse(localStorage.getItem('sv_mobile_save'));
            p1.coins = d.coins||0; unlocked = d.skins||['green']; p1.skin = d.curr||'green';
        }
        function save(){ localStorage.setItem('sv_mobile_save', JSON.stringify({coins:p1.coins, skins:unlocked, curr:p1.skin})); }

        // --- FULLSCREEN LOGIC ---
        function enterFullScreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen().catch(err=>{});
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen().catch(err=>{});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen().catch(err=>{});
            else if (el.msRequestFullscreen) el.msRequestFullscreen().catch(err=>{});
        }

        // --- THREE JS ---
        const canvas = document.getElementById('gl-canvas');
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050510, 0.025);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.setSize(window.innerWidth, window.innerHeight); 
        renderer.shadowMap.enabled = true;

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.5, 0.8));

        // Environment
        const starGeo = new THREE.BufferGeometry(); const starPos = new Float32Array(1500);
        for(let i=0;i<1500;i++) starPos[i]=(Math.random()-0.5)*400;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:0.5})); scene.add(stars);

        const gridHelper = new THREE.GridHelper(300, 60, 0x00ffff, 0x111122); gridHelper.position.y=0.05; scene.add(gridHelper);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({color:0x050505, roughness:0.2, metalness:0.6}));
        floor.rotation.x = -Math.PI/2; floor.receiveShadow=true; scene.add(floor);

        const light = new THREE.DirectionalLight(0xffffff, 1.3); light.position.set(20,50,20); light.castShadow=true; scene.add(light);
        scene.add(new THREE.AmbientLight(0x404060, 0.6));

        // --- UI FUNCTIONS ---
        window.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id==='shop-screen') renderShop();
        };

        window.submitLogin = () => {
            enterFullScreen(); // Trigger Fullscreen on Interaction
            const n = document.getElementById('username-input').value;
            if(!n) return showNotif("NAME REQUIRED");
            myName = n; document.getElementById('welcome-msg').innerText = "WELCOME " + n.toUpperCase();
            showScreen('menu-screen');
        };

        window.redeemCode = () => {
            const c = document.getElementById('secret-code').value.toUpperCase();
            if(c==="TITAN") { p1.coins+=1000; showNotif("1000 GEMS"); }
            else if(c==="GOD") { p1.coins+=5000; showNotif("GOD FUNDS"); }
            else showNotif("INVALID");
            save();
        };

        function renderShop() {
            const g=document.getElementById('shop-grid'); g.innerHTML=''; document.getElementById('shop-coins').innerText=p1.coins;
            skins.forEach(s=>{
                const d=document.createElement('div'); const own=unlocked.includes(s.id);
                d.className = `shop-item ${p1.skin===s.id ? 'selected' : ''}`;
                d.innerHTML=`<div style="width:30px;height:30px;background:#${s.color.toString(16)};border-radius:50%;margin-bottom:5px;box-shadow:0 0 5px currentColor;"></div>
                    <strong style="color:white;font-size:14px">${s.name}</strong>
                    <button class="btn" style="width:100%;padding:5px;font-size:12px;margin-top:5px" onclick="buy('${s.id}',${s.price})">${own?(p1.skin===s.id?"EQUIPPED":"EQUIP"):s.price}</button>`;
                g.appendChild(d);
            });
        }
        window.buy = (id,p) => { 
            if(unlocked.includes(id)){ p1.skin=id; save(); renderShop(); }
            else if(p1.coins>=p){ p1.coins-=p; unlocked.push(id); p1.skin=id; save(); renderShop(); }
        };

        // --- MP LOGIC ---
        window.startSinglePlayer = () => { mode = 'single'; startGame(); };
        window.createRoom = () => {
            const c = document.getElementById('create-code-input').value;
            if(!c||c.length<3) return showNotif("BAD CODE");
            initPeer(PREFIX+c, true);
        };
        window.joinRoom = () => {
            const c = document.getElementById('join-code-input').value;
            if(!c) return showNotif("ENTER CODE");
            initPeer(PREFIX+c, false);
        };

        function initPeer(id, isHost) {
            document.getElementById('mp-loader').style.display='block';
            document.getElementById('mp-status').innerText = isHost ? "CREATING..." : "CONNECTING...";
            peer = new Peer(isHost ? id : null);
            peer.on('open', (pid) => {
                if(isHost) {
                    document.getElementById('mp-status').innerText = "WAITING FOR PLAYER...";
                    mode='host'; peer.on('connection', (c)=>{ conn=c; setupConn(); });
                } else {
                    mode='client'; conn=peer.connect(id);
                    conn.on('open', setupConn);
                    setTimeout(()=>{if(!conn.open) document.getElementById('mp-status').innerText="NOT FOUND";}, 3000);
                }
            });
            peer.on('error', ()=>{document.getElementById('mp-status').innerText="ERROR/TAKEN"; document.getElementById('mp-loader').style.display='none';});
        }
        function setupConn(){ 
            conn.send({type:'init', name:myName, skin:p1.skin}); 
            conn.on('data', handleData); 
            setTimeout(startGame, 1000); 
        }
        function handleData(d) {
            if(d.type==='init') { p2.skin=d.skin; showNotif(d.name+" JOINED!"); if(remotePlayer){scene.remove(remotePlayer);} remotePlayer=createChar(p2.skin); scene.add(remotePlayer); }
            if(d.type==='update') { p2.x=d.x; p2.z=d.z; p2.rot=d.rot; p2.isAtk=d.isAtk; if(mode==='client'&&d.enemies) syncEnemies(d.enemies); }
            if(d.type==='hit' && mode==='host') { const e=enemies.find(x=>x.id===d.eid); if(e) takeDamage(e, 20); }
        }
        function syncEnemies(list) {
            list.forEach(s=>{
                let l=enemies.find(e=>e.id===s.id);
                if(!l){const m=createChar('enemy'); scene.add(m); l={mesh:m, id:s.id}; enemies.push(l);}
                l.mesh.position.set(s.x,0,s.z); l.mesh.rotation.y=s.rot;
            });
            for(let i=enemies.length-1;i>=0;i--) if(!list.find(s=>s.id===enemies[i].id)){scene.remove(enemies[i].mesh); enemies.splice(i,1);}
        }

        // --- GAMEPLAY ---
        function startGame() {
            enterFullScreen();
            document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
            document.getElementById('hud-layer').style.display='block';
            if('ontouchstart' in window) document.getElementById('joystick-zone').style.display='block';
            
            gameActive=true; enemies=[]; particles=[];
            p1.hp=100; p1.kills=0; updateHUD();

            if(localPlayer) scene.remove(localPlayer);
            localPlayer = createChar(p1.skin); scene.add(localPlayer);
            
            if(mode!=='single') {
                if(remotePlayer) scene.remove(remotePlayer);
                remotePlayer = createChar(p2.skin || 'green'); 
                remotePlayer.position.set(5,0,0); scene.add(remotePlayer);
            }
            animate();
        }

        function createChar(type) {
            const g = new THREE.Group();
            let c = skins.find(s=>s.id===type)?.color || 0x2ecc71;
            if(type==='enemy') c=0x550000;

            const mat = new THREE.MeshStandardMaterial({color:c});
            const skinMat = new THREE.MeshStandardMaterial({color:0xffccaa});
            if(type==='hulk') skinMat.color.setHex(0x32CD32);
            if(type==='eren') mat.color.setHex(0x8b4513);

            let s = 1; if(type==='hulk') s=1.4; if(type==='eren') s=1.3;

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), mat); body.position.y=0.9;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.35, 0.3), (type==='eren'||type==='enemy')?mat:skinMat); head.position.y=0.5; body.add(head);

            if(type==='goku') {
                const h = new THREE.Group();
                for(let i=0;i<5;i++){const k=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.4,4), new THREE.MeshBasicMaterial({color:0x111111})); k.position.y=0.2; k.rotation.z=(i-2)*0.5; h.add(k);}
                head.add(h);
            }
            if(type==='naruto') { const b=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.08,0.32), new THREE.MeshBasicMaterial({color:0x333333})); b.position.y=0.15; head.add(b); }
            if(type==='gojo') { const b=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.1,0.32), new THREE.MeshBasicMaterial({color:0x000000})); b.position.y=0.05; head.add(b); }
            if(type==='saitama') { const cp=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.8,0.05), new THREE.MeshStandardMaterial({color:0xffffff})); cp.position.set(0,-0.1,-0.2); cp.rotation.x=0.2; body.add(cp); }
            if(type==='jinwoo') { const glow=new THREE.PointLight(0x9933ff, 1, 2); body.add(glow); }

            const lGeo = new THREE.BoxGeometry(0.15, 0.55, 0.15);
            const lArm = new THREE.Mesh(lGeo, (type==='hulk'||type==='eren')?skinMat:mat); lArm.position.set(-0.35, 0.1, 0); body.add(lArm);
            const rArm = new THREE.Mesh(lGeo, (type==='hulk'||type==='eren')?skinMat:mat); rArm.position.set(0.35, 0.1, 0); body.add(rArm);
            const lLeg = new THREE.Mesh(lGeo, type==='eren'?mat:new THREE.MeshStandardMaterial({color:0x222222})); lLeg.position.set(-0.15, -0.6, 0); body.add(lLeg);
            const rLeg = new THREE.Mesh(lGeo, type==='eren'?mat:new THREE.MeshStandardMaterial({color:0x222222})); rLeg.position.set(0.15, -0.6, 0); body.add(rLeg);

            g.add(body); g.scale.set(s,s,s);
            g.userData = { body, lArm, rArm, lLeg, rLeg };
            return g;
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!gameActive) { composer.render(); return; }

            if(keys.w||joystick.dy<-0.1) p1.vz -= 0.05;
            if(keys.s||joystick.dy>0.1) p1.vz += 0.05;
            if(keys.a||joystick.dx<-0.1) p1.vx -= 0.05;
            if(keys.d||joystick.dx>0.1) p1.vx += 0.05;
            
            localPlayer.position.x += p1.vx; localPlayer.position.z += p1.vz;
            p1.vx *= 0.85; p1.vz *= 0.85;

            localPlayer.position.y += p1.vy;
            if(localPlayer.position.y > 0) p1.vy -= 0.05;
            else { localPlayer.position.y=0; p1.vy=0; p1.isAir=false; }

            if(Math.abs(p1.vx)+Math.abs(p1.vz)>0.01) localPlayer.rotation.y = Math.atan2(p1.vx, p1.vz);
            updateAnim(localPlayer, Math.abs(p1.vx)+Math.abs(p1.vz)>0.01, p1.isAtk);

            if(remotePlayer && mode!=='single') {
                remotePlayer.position.x += (p2.x-remotePlayer.position.x)*0.2;
                remotePlayer.position.z += (p2.z-remotePlayer.position.z)*0.2;
                remotePlayer.rotation.y = p2.rot;
                updateAnim(remotePlayer, true, p2.isAtk);
            }

            if(mode==='single' || mode==='host') {
                if(Math.random()<0.02 && enemies.length<10) spawnEnemy();
                enemies.forEach(e => {
                    let target = localPlayer.position;
                    if(remotePlayer && e.mesh.position.distanceTo(remotePlayer.position) < e.mesh.position.distanceTo(target)) target = remotePlayer.position;
                    e.mesh.lookAt(target); e.mesh.translateZ(0.06);
                    updateAnim(e.mesh, true, false);
                    if(e.mesh.position.distanceTo(localPlayer.position)<1.5) { p1.hp-=0.5; updateHUD(); if(p1.hp<=0) gameOver(); }
                });
            }

            if(conn && conn.open) {
                const pkt = { type:'update', x:localPlayer.position.x, z:localPlayer.position.z, rot:localPlayer.rotation.y, isAtk:p1.isAtk };
                if(mode==='host') pkt.enemies = enemies.map(e=>({id:e.id, x:e.mesh.position.x, z:e.mesh.position.z, rot:e.mesh.rotation.y}));
                conn.send(pkt);
            }

            let camDist = 12; if(p1.skin==='eren'||p1.skin==='hulk') camDist=15;
            camera.position.x += (localPlayer.position.x - camera.position.x)*0.1;
            camera.position.z += ((localPlayer.position.z+camDist) - camera.position.z)*0.1;
            camera.position.y = 10; camera.lookAt(localPlayer.position);

            for(let i=particles.length-1;i>=0;i--){
                let p=particles[i]; p.position.add(p.vel); p.scale.multiplyScalar(0.9);
                if(p.scale.x<0.01){scene.remove(p); particles.splice(i,1);}
            }
            composer.render();
        }

        function updateAnim(mesh, move, atk) {
            const t = Date.now()*0.01; const p=mesh.userData;
            if(atk) { p.rArm.rotation.x = -1.5; }
            else if(move) {
                p.lLeg.rotation.x = Math.sin(t*10)*0.5; p.rLeg.rotation.x = -Math.sin(t*10)*0.5;
                p.lArm.rotation.x = -Math.sin(t*10)*0.5; p.rArm.rotation.x = Math.sin(t*10)*0.5;
            } else { p.lLeg.rotation.x=0; p.rLeg.rotation.x=0; p.rArm.rotation.x=0; }
        }

        function spawnEnemy(){ const m=createChar('enemy'); const a=Math.random()*6.28; m.position.set(Math.cos(a)*40,0,Math.sin(a)*40); scene.add(m); enemies.push({mesh:m, hp:30, id:Math.random()}); }
        function attack() {
            if(p1.isAtk) return; p1.isAtk=true; setTimeout(()=>p1.isAtk=false, 300);
            if(mode!=='client') { enemies.forEach(e=>{ if(localPlayer.position.distanceTo(e.mesh.position)<4) takeDamage(e, 20); }); }
            else { enemies.forEach(e=>{ if(localPlayer.position.distanceTo(e.mesh.position)<4) conn.send({type:'hit', eid:e.id}); }); }
        }
        function takeDamage(e, d) {
            e.hp-=d;
            const t=document.createElement('div'); t.className='dmg-text'; t.innerText=d; 
            const p=e.mesh.position.clone().project(camera); t.style.left=(p.x+1)/2*window.innerWidth+'px'; t.style.top=(-p.y+1)/2*window.innerHeight+'px';
            document.body.appendChild(t); setTimeout(()=>t.remove(),800);
            createExplosion(e.mesh.position);
            if(e.hp<=0) { scene.remove(e.mesh); enemies=enemies.filter(x=>x!==e); p1.coins+=15; p1.kills++; updateHUD(); }
        }
        function createExplosion(pos) {
            const mat = new THREE.MeshBasicMaterial({color:0xffaa00});
            for(let i=0;i<6;i++){
                const p=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), mat);
                p.position.copy(pos); p.vel = new THREE.Vector3((Math.random()-0.5), Math.random(), (Math.random()-0.5));
                scene.add(p); particles.push(p);
            }
        }
        function updateHUD(){ document.getElementById('hp-val').innerText=Math.ceil(p1.hp); document.getElementById('coin-val').innerText=p1.coins; document.getElementById('kill-val').innerText=p1.kills; }
        function gameOver() { gameActive=false; document.getElementById('hud-layer').style.display='none'; document.getElementById('gameover-screen').classList.remove('hidden'); }
        function showNotif(msg){ const n=document.getElementById('notif'); n.innerText=msg; n.style.display='block'; setTimeout(()=>n.style.display='none',1500); }

        window.onresize=()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); composer.setSize(window.innerWidth,window.innerHeight); };
        window.onkeydown=e=>keys[e.key.toLowerCase()]=true; window.onkeyup=e=>{keys[e.key.toLowerCase()]=false; if(e.key===' ') {p1.vy=0.8;p1.isAir=true;}};
        const bind=(id,fn)=>{ const el=document.getElementById(id); el.ontouchstart=e=>{e.preventDefault();fn();el.style.transform='scale(0.9)'}; el.ontouchend=e=>{e.preventDefault();el.style.transform='scale(1)'}; };
        bind('btn-atk', attack); bind('btn-jmp', ()=>{if(!p1.isAir){p1.vy=0.8;p1.isAir=true}}); bind('btn-dsh', ()=>{p1.vx+=Math.sin(localPlayer.rotation.y)*2; p1.vz+=Math.cos(localPlayer.rotation.y)*2});
        const jZone=document.getElementById('joystick-zone'); let jS={x:0,y:0};
        jZone.ontouchstart=e=>{e.preventDefault(); joystick.on=true; jS.x=e.touches[0].clientX; jS.y=e.touches[0].clientY;};
        jZone.ontouchmove=e=>{e.preventDefault(); if(!joystick.on)return; const dx=e.touches[0].clientX-jS.x, dy=e.touches[0].clientY-jS.y, d=Math.min(50,Math.hypot(dx,dy)), a=Math.atan2(dy,dx); joystick.dx=Math.cos(a)*d/50; joystick.dy=Math.sin(a)*d/50; document.getElementById('joystick-knob').style.transform=`translate(calc(-50% + ${joystick.dx*50}px), calc(-50% + ${joystick.dy*50}px))`;};
        jZone.ontouchend=e=>{e.preventDefault(); joystick.on=false; joystick.dx=0; joystick.dy=0; document.getElementById('joystick-knob').style.transform='translate(-50%,-50%)';};
        animate();
    </script>
</body>
</html>
