<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="sRmD5fZDKLPRccmheUKVp_IWacZxb8yLK9AKPmt50lY" /> 
    <title>EdgeOne Gaming Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #bc13fe; /* Purple Neon */
            --bg-color: #050505;
            --glass-bg: rgba(20, 0, 30, 0.3);
            --glass-border: rgba(188, 19, 254, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh; 
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Starfield Background */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Main Container - Glassmorphism */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.15);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease-out;
            max-height: 90vh; /* Prevent overflow on small screens */
            overflow-y: auto; /* Allow scrolling if list gets long */
        }

        /* Custom scrollbar for container */
        .container::-webkit-scrollbar { width: 4px; }
        .container::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(188, 19, 254, 0.6);
            text-transform: uppercase;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Button Styling */
        .game-btn {
            position: relative;
            display: block;
            padding: 1rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            text-decoration: none;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            transition: all 0.2s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            overflow: hidden;
        }

        .game-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(188, 19, 254, 0.4), transparent);
            transition: 0.4s;
        }

        .game-btn:hover {
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 0 25px var(--primary-color);
            transform: scale(1.02);
            font-weight: 700;
        }

        .game-btn:hover::before {
            left: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; margin-bottom: 1.5rem; }
            .game-btn { font-size: 0.9rem; padding: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Star Effect -->
    <canvas id="canvas"></canvas>

    <div class="container">
        <h1>EdgeOne Nexus</h1>
        <div class="button-grid">
            <a href="https://rudra.edgeone.dev/" target="_blank" class="game-btn">Rudra</a>
            <a href="https://omvnine.edgeone.dev/" target="_blank" class="game-btn">Omvnine</a>
            <a href="https://aether.edgeone.dev/" target="_blank" class="game-btn">Aether</a>
            <a href="https://virtualmouseai.edgeone.dev/" target="_blank" class="game-btn">Virtual Mouse AI</a>
            <a href="https://apkforge.edgeone.dev/" target="_blank" class="game-btn">APK Forge</a>
            <a href="https://lakshyagame.edgeone.dev/" target="_blank" class="game-btn">TitanSmash</a>
            <a href="https://stickmantwod.edgeone.dev/" target="_blank" class="game-btn">Stickmantwod</a>
            <a href="https://space-dodger.edgeone.dev/" target="_blank" class="game-btn">Space-Dodger</a>
        </div>
        <div class="footer">SYSTEM ONLINE // READY PLAYER ONE</div>
    </div>

    <script>
        // Starfield Animation
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * width; 
                this.pz = this.z;
            }

            update() {
                this.z = this.z - 25; // Speed
                if (this.z < 1) {
                    this.reset();
                }
            }

            show() {
                let sx = (this.x - width / 2) * (width / this.z) + width / 2;
                let sy = (this.y - height / 2) * (width / this.z) + height / 2;
                
                let px = (this.x - width / 2) * (width / this.pz) + width / 2;
                let py = (this.y - height / 2) * (width / this.pz) + height / 2;

                this.pz = this.z;

                ctx.beginPath();
                ctx.strokeStyle = "rgba(188, 19, 254, 0.5)"; /* Purple trails */
                ctx.lineWidth = (1 - this.z / width) * 2; /* Thicker as they get closer */
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.4)"; // Trail effect
            ctx.fillRect(0, 0, width, height);

            for (let star of stars) {
                star.update();
                star.show();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        resize();
        initStars();
        animate();
    </script>
</body>
</html>
