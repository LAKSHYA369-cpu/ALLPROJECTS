<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independent Agentic AI Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --accent: #00f2fe; --bg: #0f172a; --panel: #1e293b; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar for History */
        #sidebar { width: 280px; background: #020617; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; }
        .history-item { background: var(--panel); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .history-item:hover { border-color: var(--accent); }
        
        /* Main Area */
        main { flex: 1; overflow-y: auto; padding: 30px; }
        .glass { background: var(--panel); border-radius: 16px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #064e3b; color: #34d399; margin-bottom: 10px; }
        
        input, textarea, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; width: 100%; margin: 8px 0; box-sizing: border-box; }
        .btn { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #000; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        #canvas3d { width: 100%; height: 250px; border-radius: 12px; background: #000; margin-top: 15px; }
        .hidden { display: none; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

<aside id="sidebar">
    <h2 style="color: var(--accent); font-size: 18px;">Agentic History</h2>
    <button class="btn" style="padding: 8px; font-size: 12px; margin-bottom: 15px;" onclick="clearHistory()">Clear Cache</button>
    <div id="history-list" style="overflow-y: auto; flex: 1;">
        </div>
    <div style="font-size: 10px; color: #64748b; text-align: center;">Local Browser Storage Active</div>
</aside>

<main>
    <div class="glass">
        <div class="status-pill">Local Smart Agent Online</div>
        <h1>Independent AI Studio</h1>
        
        <label>Settings (Auto-Saved):</label>
        <input type="password" id="apiKey" placeholder="Gemini API Key..." onchange="saveKey()">
        
        <nav style="display: flex; gap: 10px; margin: 20px 0;">
            <button class="btn" onclick="toggleMode('gen')">AI Generator</button>
            <button class="btn" onclick="toggleMode('conv')">Smart Converter</button>
        </nav>
    </div>

    <div id="gen-panel" class="glass">
        <h3>Text-to-Everything</h3>
        <textarea id="prompt" rows="3" placeholder="Describe what you want (e.g., 'Generate a blue sphere 3D model' or 'Write a report')"></textarea>
        <select id="taskType">
            <option value="3d">3D Model Generation (Local)</option>
            <option value="text">Smart Analysis (Gemini)</option>
            <option value="img">Visual Concept (Placeholder)</option>
        </select>
        <button class="btn" onclick="processAgentTask()">Run Agent</button>
        <div id="canvas3d" class="hidden"></div>
        <div id="output-box" style="margin-top: 15px; color: #94a3b8; font-style: italic;"></div>
    </div>

    <div id="conv-panel" class="glass hidden">
        <h3>Multi-Format Converter</h3>
        <input type="file" id="fileIn">
        <select id="outFormat">
            <option value="pdf">Convert to PDF</option>
            <option value="xlsx">Convert to Excel</option>
            <option value="txt">Convert to Text</option>
        </select>
        <button class="btn" onclick="handleConversion()">Execute Conversion</button>
    </div>
</main>

<script>
    // --- DATABASE & HISTORY LOGIC (LocalStorage) ---
    let historyData = JSON.parse(localStorage.getItem('ai_history')) || [];

    function saveToHistory(type, input, output) {
        const item = { id: Date.now(), type, input, output, date: new Date().toLocaleString() };
        historyData.unshift(item);
        localStorage.setItem('ai_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = historyData.map(item => `
            <div class="history-item" onclick="loadHistoryItem(${item.id})">
                <strong>${item.type.toUpperCase()}</strong><br>
                <span style="color: #64748b;">${item.input.substring(0, 30)}...</span>
            </div>
        `).join('');
    }

    function loadHistoryItem(id) {
        const item = historyData.find(i => i.id === id);
        alert(`History Details:\n\nPrompt: ${item.input}\n\nResult: ${item.output}`);
    }

    function clearHistory() {
        localStorage.removeItem('ai_history');
        historyData = [];
        renderHistory();
    }

    function saveKey() {
        localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value);
    }

    // --- INITIALIZATION ---
    window.onload = () => {
        renderHistory();
        document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    };

    function toggleMode(m) {
        document.getElementById('gen-panel').classList.toggle('hidden', m !== 'gen');
        document.getElementById('conv-panel').classList.toggle('hidden', m !== 'conv');
    }

    // --- LOCAL 3D ENGINE (Three.js) ---
    let scene, camera, renderer, mesh;
    function run3D(shape) {
        document.getElementById('canvas3d').classList.remove('hidden');
        if (!scene) {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, 500/250, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(document.getElementById('canvas3d').clientWidth, 250);
            document.getElementById('canvas3d').appendChild(renderer.domElement);
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 5, 5).normalize();
            scene.add(light);
            camera.position.z = 3;
            function animate() { requestAnimationFrame(animate); if(mesh) mesh.rotation.y += 0.01; renderer.render(scene, camera); }
            animate();
        }
        if(mesh) scene.remove(mesh);
        let geom = shape.includes('box') ? new THREE.BoxGeometry() : new THREE.SphereGeometry(1, 32, 32);
        mesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color: 0x00f2fe, wireframe: true }));
        scene.add(mesh);
    }

    // --- AGENTIC EXECUTION ---
    async function processAgentTask() {
        const prompt = document.getElementById('prompt').value;
        const type = document.getElementById('taskType').value;
        const outputBox = document.getElementById('output-box');

        if (!prompt) return alert("Prompt empty!");

        if (type === '3d') {
            run3D(prompt.toLowerCase());
            outputBox.innerText = "Local 3D mesh generated successfully.";
            saveToHistory('3d', prompt, 'Generated 3D Mesh');
        } else {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("API Key missing!");
            outputBox.innerText = "Agent is thinking...";
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                outputBox.innerText = text;
                saveToHistory('text', prompt, text);
            } catch (e) {
                outputBox.innerText = "Error: Check API Key or Connection.";
            }
        }
    }

    // --- CONVERTER LOGIC ---
    function handleConversion() {
        const format = document.getElementById('outFormat').value;
        const text = document.getElementById('output-box').innerText || "Empty Content";
        
        if (format === 'pdf') {
            const doc = new jspdf.jsPDF();
            doc.text(text, 10, 10);
            doc.save("agent_export.pdf");
        } else if (format === 'xlsx') {
            const ws = XLSX.utils.aoa_to_sheet([[text]]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "AI_Data");
            XLSX.writeFile(wb, "agent_export.xlsx");
        }
        saveToHistory('convert', 'File Export', `Exported as ${format}`);
    }
</script>

</body>
</html>
